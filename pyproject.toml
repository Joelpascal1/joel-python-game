[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "joel-python-game"
version = "0.1.0"
description = "A beginner-friendly Python game learning repository"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Joel" }]

[tool.setuptools]
packages = ["games"]
